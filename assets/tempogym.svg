<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Tempo Gym: el cliente reserva una clase y entra en lista de espera si está llena">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1b3f"/>
      <stop offset="100%" stop-color="#1f51a5"/>
    </linearGradient>
    <clipPath id="pantalla"><rect x="372" y="44" width="256" height="472" rx="26"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; }
      .sel { opacity: 0; animation: seleccion 10s infinite; }
      @keyframes seleccion { 0%, 18% { opacity: 0; } 22%, 60% { opacity: 1; } 64%, 100% { opacity: 0; } }
      .libre { animation: antes 10s infinite; }
      @keyframes antes { 0%, 34% { opacity: 1; } 36%, 100% { opacity: 0; } }
      .reservada { opacity: 0; animation: despues 10s infinite; }
      @keyframes despues { 0%, 34% { opacity: 0; } 36%, 96% { opacity: 1; } 100% { opacity: 0; } }
      .espera { animation: latir 10s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes latir { 0%, 66% { transform: scale(1); } 70% { transform: scale(1.12); } 74%, 100% { transform: scale(1); } }
      .aviso { opacity: 0; animation: aviso 10s infinite; }
      @keyframes aviso { 0%, 72% { opacity: 0; transform: translateY(-20px); } 76%, 94% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
      .dedo { opacity: 0; animation: tocar 10s infinite; }
      @keyframes tocar { 0%, 16% { opacity: 0; transform: translate(80px, 90px); } 20%, 34% { opacity: 1; transform: translate(0, 0); } 40%, 100% { opacity: 0; transform: translate(60px, 60px); } }
    </style>
  </defs>

  <rect width="1000" height="560" rx="18" fill="url(#fondo)"/>
  <g opacity="0.2">
    <circle cx="120" cy="110" r="60" fill="#60a5fa"/>
    <circle cx="890" cy="440" r="80" fill="#93c5fd"/>
  </g>

  <g class="t">
    <circle cx="96" cy="200" r="26" fill="#1f51a5" stroke="#bfdbfe" stroke-width="2"/>
    <text x="96" y="208" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">TG</text>
    <text x="70" y="270" font-size="40" font-weight="800" fill="#eff6ff">Tempo Gym</text>
    <text x="70" y="310" font-size="18" fill="#bfdbfe">1. Ve las clases de la semana</text>
    <text x="70" y="338" font-size="18" fill="#bfdbfe">2. Reserva tu plaza</text>
    <text x="70" y="366" font-size="18" fill="#bfdbfe">3. Lista de espera si está llena</text>
    <text x="70" y="420" font-size="15" fill="#93c5fd" opacity="0.85">Flutter · Supabase</text><text x="70" y="442" font-size="15" fill="#93c5fd" opacity="0.85">Android, web y Windows</text>
  </g>

  <rect x="360" y="30" width="280" height="500" rx="38" fill="#0f172a" stroke="#1e40af" stroke-width="3"/>
  <g clip-path="url(#pantalla)" class="t">
    <rect x="372" y="44" width="256" height="472" fill="#f8fafc"/>
    <rect x="372" y="44" width="256" height="64" fill="#1f51a5"/>
    <text x="390" y="82" font-size="18" font-weight="800" fill="#fff">Clases · Jueves 6</text>

    <!-- días -->
    <g font-size="12" text-anchor="middle" fill="#334155">
      <text x="398" y="132">L</text><text x="432" y="132">M</text><text x="466" y="132">X</text>
      <rect x="486" y="117" width="28" height="22" rx="11" fill="#1f51a5"/><text x="500" y="132" fill="#fff" font-weight="700">J</text>
      <text x="534" y="132">V</text><text x="568" y="132">S</text><text x="602" y="132">D</text>
    </g>

    <!-- clases -->
    <g font-size="14">
      <rect x="386" y="152" width="228" height="62" rx="12" fill="#fff" stroke="#e2e8f0"/>
      <text x="400" y="176" font-weight="700" fill="#0f172a">Spinning</text>
      <text x="400" y="198" font-size="12" fill="#64748b">09:00 · Sala 1</text>
      <text x="600" y="190" font-size="12" fill="#16a34a" text-anchor="end">5 plazas</text>

      <rect x="386" y="224" width="228" height="62" rx="12" fill="#fff" stroke="#e2e8f0"/>
      <rect class="sel" x="386" y="224" width="228" height="62" rx="12" fill="#dbeafe" stroke="#1f51a5" stroke-width="2"/>
      <text x="400" y="248" font-weight="700" fill="#0f172a">Yoga</text>
      <text x="400" y="270" font-size="12" fill="#64748b">10:30 · Sala 2</text>
      <g class="libre"><rect x="528" y="244" width="74" height="26" rx="13" fill="#1f51a5"/><text x="565" y="262" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Reservar</text></g>
      <g class="reservada"><rect x="510" y="244" width="92" height="26" rx="13" fill="#16a34a"/><text x="556" y="262" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">✓ Reservada</text></g>

      <rect x="386" y="296" width="228" height="62" rx="12" fill="#fff" stroke="#e2e8f0"/>
      <text x="400" y="320" font-weight="700" fill="#0f172a">Pilates</text>
      <text x="400" y="342" font-size="12" fill="#64748b">18:00 · Sala 2</text>
      <text x="600" y="334" font-size="12" fill="#ea580c" text-anchor="end">1 plaza</text>

      <rect x="386" y="368" width="228" height="62" rx="12" fill="#fff" stroke="#e2e8f0"/>
      <text x="400" y="392" font-weight="700" fill="#0f172a">Crossfit</text>
      <text x="400" y="414" font-size="12" fill="#64748b">19:30 · Box</text>
      <g class="espera"><rect x="504" y="388" width="98" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/><text x="553" y="406" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Lista de espera</text></g>
    </g>

    <!-- aviso -->
    <g class="aviso">
      <rect x="386" y="446" width="228" height="54" rx="12" fill="#0f172a"/>
      <text x="400" y="469" font-size="13" font-weight="700" fill="#fff">🔔 Te avisamos si se libera</text>
      <text x="400" y="489" font-size="12" fill="#cbd5e1">una plaza en Crossfit</text>
    </g>
  </g>

  <g class="dedo"><circle cx="566" cy="258" r="15" fill="#fde68a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="2"/></g>
</svg>
