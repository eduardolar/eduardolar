<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Concesionario con semáforos: cuatro clientes comparten tres vehículos">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; fill: #fff7ed; }
      .hilo { animation: avanzar 3s ease-in-out infinite; }
      .h2 { animation-delay: -0.75s; } .h3 { animation-delay: -1.5s; } .h4 { animation-delay: -2.25s; }
      @keyframes avanzar { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(150px); } }
    </style>
  </defs>
  <rect width="640" height="320" rx="16" fill="url(#f)"/>
  <text class="t" x="32" y="56" font-size="30" font-weight="800">ConcesionarioSemaforos</text>
  <text class="t" x="32" y="88" font-size="17" opacity="0.8">Java · hilos · Semaphore · synchronized</text>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15">
    <g class="hilo"><rect x="40" y="120" width="110" height="30" rx="15" fill="#fb923c"/><text x="62" y="140" fill="#1c1917">Cliente 1</text></g>
    <g class="hilo h2"><rect x="40" y="160" width="110" height="30" rx="15" fill="#fdba74"/><text x="62" y="180" fill="#1c1917">Cliente 2</text></g>
    <g class="hilo h3"><rect x="40" y="200" width="110" height="30" rx="15" fill="#fb923c"/><text x="62" y="220" fill="#1c1917">Cliente 3</text></g>
    <g class="hilo h4"><rect x="40" y="240" width="110" height="30" rx="15" fill="#fdba74"/><text x="62" y="260" fill="#1c1917">Cliente 4</text></g>
  </g>
  <rect x="330" y="112" width="6" height="166" rx="3" fill="#fef3c7" opacity="0.6"/>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#fff7ed">
    <rect x="380" y="126" width="210" height="40" rx="10" fill="#fff7ed" fill-opacity="0.12" stroke="#fdba74"/><text x="398" y="152">🚗  Vehículo 1</text>
    <rect x="380" y="176" width="210" height="40" rx="10" fill="#fff7ed" fill-opacity="0.12" stroke="#fdba74"/><text x="398" y="202">🚙  Vehículo 2</text>
    <rect x="380" y="226" width="210" height="40" rx="10" fill="#fff7ed" fill-opacity="0.12" stroke="#fdba74"/><text x="398" y="252">🚕  Vehículo 3</text>
  </g>
</svg>
